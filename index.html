<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nosso Dinheiro</title>
<style>
:root{
  --azul:#1B4B4A; --azul-escuro:#0F302F; --azul-claro:#2E6E6C; --azul-accent:#3D8A87;
  --dourado:#C9A57D; --dourado-escuro:#A67A4E; --dourado-claro:#F5EDDD;
  --verde:#2F7D4F; --verde-escuro:#1F5A38; --verde-med:#3D9463; --verde-claro:#DCF0E3;
  --vermelho:#9B2335; --vermelho-claro:#F5DBDD;
  --amarelo:#B7791F; --amarelo-claro:#FBF0DA;
  --roxo:#5B3E96; --roxo-claro:#EDE6F7;
  --laranja:#C05621; --laranja-claro:#FBE9DD;
  --cinza-claro:#E8E1D3; --cinza-med:#8A8271; --cinza-escuro:#3B342A; --cinza-ultra:#F5F0E6;
  --bg:#FAF6F0; --bg-input:#FFFFFF;
  --txt-azul:var(--azul); --txt-verde:var(--verde); --txt-vermelho:var(--vermelho);
  --txt-amarelo:var(--amarelo); --txt-roxo:var(--roxo); --txt-laranja:var(--laranja);
  --txt-dourado:var(--dourado-escuro);
}
body.tema-escuro{
  --bg:#1A1815; --bg-input:#252119; --cinza-ultra:#252118; --cinza-claro:#3A352A;
  --cinza-escuro:#E7E3DA; --cinza-med:#A69D89;
  --azul-claro:#5B87CC; --azul-accent:#5B87CC;
  --verde-claro:#1E3B2A; --vermelho-claro:#3D2024; --amarelo-claro:#3D3117;
  --roxo-claro:#2C2440; --laranja-claro:#3D2A18; --dourado-claro:#3D3423;
  --txt-azul:#7CA6E0; --txt-verde:#4ADE80; --txt-vermelho:#F87171;
  --txt-amarelo:#FBBF24; --txt-roxo:#C4AAF5; --txt-laranja:#FB923C;
  --txt-dourado:#D4B673;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--cinza-escuro);transition:background .2s}
.overlay-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:499}
.overlay-bg.show{display:block}
#loading-bar{position:fixed;top:0;left:0;height:3px;background:var(--dourado);width:0;z-index:9999;transition:width .3s}

/* LOGIN */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:white;border-radius:16px;padding:36px 30px;max-width:340px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.12)}
.login-logo{text-align:center;margin-bottom:18px}
.login-logo-icon{width:74px;height:74px;border-radius:50%;background:linear-gradient(135deg,var(--azul),var(--verde));display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 12px}
.login-logo h1{font-size:22px;color:var(--azul);font-weight:800}
.login-logo p{font-size:12px;color:var(--cinza-med);margin-top:2px}
.login-divisor{height:3px;width:50px;background:var(--dourado);margin:14px auto 0;border-radius:2px}
.login-input{width:100%;padding:13px 14px;border:1.5px solid var(--cinza-claro);border-radius:9px;font-size:15px;margin-bottom:12px}
.login-btn{width:100%;padding:13px;background:var(--azul);color:white;border:none;border-radius:9px;font-size:15px;font-weight:700;cursor:pointer}
.login-btn:hover{background:var(--azul-escuro)}
.login-error{color:var(--vermelho);font-size:12.5px;text-align:center;margin-bottom:8px;min-height:0}

/* SIDEBAR / TOPBAR */
body.sidebar-hidden #sidebar{transform:translateX(-100%)}
#sidebar{position:fixed;top:0;left:0;width:250px;height:100vh;background:var(--azul);color:white;overflow-y:auto;z-index:500;transition:transform .25s}
#sidebar-logo{padding:20px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.12)}
#sidebar-logo .icon{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:20px}
#sidebar-logo h1{font-size:16px;font-weight:800}
#sidebar-logo p{font-size:10.5px;opacity:.75}
.nav-label{padding:12px 18px 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;opacity:.6;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.nav-chevron{transition:transform .2s}
.nav-group.collapsed .nav-chevron{transform:rotate(-90deg)}
.nav-group.collapsed .nav-group-items{display:none}
.nav-item{padding:10px 18px;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13.5px;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.08)}
.nav-item.active{background:rgba(255,255,255,.16);opacity:1;font-weight:600;border-left:3px solid var(--dourado)}
.nav-icon{width:18px;text-align:center}
#main{margin-left:250px;min-height:100vh;transition:margin .25s}
body.sidebar-hidden #main{margin-left:0}
#topbar{background:var(--bg);border-bottom:1px solid var(--cinza-claro);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
#topbar-right{display:flex;gap:6px;align-items:center}
#menu-toggle{background:none;border:1.5px solid var(--cinza-claro);border-radius:7px;padding:6px 10px;cursor:pointer;font-size:15px}
#page-title{font-size:17px;font-weight:800;color:var(--azul);margin-left:8px}
#content{padding:16px 18px 60px}
#sync-badge{font-size:11px;padding:5px 9px;border-radius:6px;font-weight:700}
#sync-badge.ok{background:var(--verde-claro);color:var(--txt-verde)}
#sync-badge.error{background:var(--vermelho-claro);color:var(--txt-vermelho)}
#sync-badge.loading{background:var(--amarelo-claro);color:var(--txt-amarelo)}

/* GENERIC UI */
.btn{border:none;border-radius:8px;padding:9px 15px;font-size:13.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.btn-primary{background:var(--azul);color:white}
.btn-success{background:var(--verde-med);color:white}
.btn-danger{background:var(--vermelho);color:white}
.btn-warning{background:var(--dourado-escuro);color:white}
.btn-outline{background:transparent;border:1.5px solid var(--cinza-claro);color:var(--cinza-escuro)}
.btn-sm{padding:6px 10px;font-size:12px}
.btn-xs{padding:4px 8px;font-size:11px}
.btn:hover{filter:brightness(0.94)}
.panel{background:var(--bg-input);border-radius:12px;margin-bottom:16px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.panel-header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--cinza-claro)}
.panel-title{font-size:15px;font-weight:800;color:var(--azul)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi-card{background:var(--bg-input);border-radius:10px;padding:14px;border-left:4px solid var(--cinza-claro)}
.kpi-card.verde{border-left-color:var(--verde-med)}
.kpi-card.vermelho{border-left-color:var(--vermelho)}
.kpi-card.roxo{border-left-color:var(--roxo)}
.kpi-card.dourado{border-left-color:var(--dourado-escuro)}
.kpi-card.amarelo{border-left-color:var(--amarelo)}
.kpi-label{font-size:10.5px;color:var(--cinza-med);text-transform:uppercase;font-weight:600;margin-bottom:4px}
.kpi-value{font-size:19px;font-weight:900;color:var(--cinza-escuro)}
.kpi-sub{font-size:11px;color:var(--cinza-med);margin-top:2px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid.cols-1{grid-template-columns:1fr}
.form-group.full{grid-column:1/-1}
.form-label{font-size:11px;font-weight:700;color:var(--cinza-escuro);text-transform:uppercase;display:block;margin-bottom:5px}
.form-input,.form-select,.form-textarea{width:100%;padding:10px 12px;border:1.5px solid var(--cinza-claro);border-radius:8px;font-size:14px;background:var(--bg-input);color:var(--cinza-escuro)}
.form-textarea{resize:vertical;min-height:60px}
.search-input{width:100%;padding:10px 14px;border:1.5px solid var(--cinza-claro);border-radius:8px;font-size:14px;background:var(--bg-input)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{background:var(--azul);color:white}
th{padding:9px 10px;text-align:left;font-size:11.5px;text-transform:uppercase;font-weight:700}
td{padding:9px 10px;border-bottom:1px solid var(--cinza-claro)}
tbody tr:hover{background:var(--cinza-ultra)}
.text-center{text-align:center}
.text-verde{color:var(--txt-verde)}
.text-vermelho{color:var(--txt-vermelho)}
.text-azul{color:var(--txt-azul)}
.fw-bold{font-weight:700}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700}
.badge-ok{background:var(--verde-claro);color:var(--txt-verde)}
.badge-warn{background:var(--amarelo-claro);color:var(--txt-amarelo)}
.badge-danger{background:var(--vermelho-claro);color:var(--txt-vermelho)}
.badge-info{background:var(--azul-claro);color:white}
.badge-gray{background:var(--cinza-claro);color:var(--cinza-med)}
.badge-p1{background:var(--azul-claro);color:white}
.badge-p2{background:var(--roxo-claro);color:var(--txt-roxo)}
.badge-casal{background:var(--dourado-claro);color:var(--txt-dourado)}
.empty-state{text-align:center;padding:40px 20px;color:var(--cinza-med)}
.empty-icon{font-size:38px;margin-bottom:8px}
.progress-bar-bg{background:var(--cinza-claro);border-radius:20px;height:10px;overflow:hidden}
.progress-bar-fill{height:100%;border-radius:20px;transition:width .3s}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:600;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:var(--bg);border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-header{background:var(--azul);color:white;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
.modal-title{font-size:16px;font-weight:800}
.modal-close{background:none;border:none;color:white;font-size:22px;cursor:pointer;line-height:1}
.modal-body{padding:18px}
.modal-footer{padding:14px 18px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--cinza-claro);background:var(--bg)}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--cinza-escuro);color:white;padding:12px 20px;border-radius:9px;font-size:13.5px;z-index:9999;transition:transform .3s;max-width:90vw}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.error{background:var(--vermelho)}

/* SELECT SEARCH (sselHTML) */
.ssel-wrap{position:relative}
.ssel-drop{display:none;position:absolute;top:100%;left:0;right:0;background:var(--bg-input);border:1.5px solid var(--cinza-claro);border-radius:8px;max-height:220px;overflow-y:auto;z-index:80;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.ssel-drop.show{display:block}
.ssel-opt{padding:10px 12px;cursor:pointer;font-size:13.5px}
.ssel-opt:hover{background:var(--cinza-ultra)}

/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dia{background:var(--bg-input);border-radius:8px;padding:6px;min-height:64px;cursor:pointer;border:1px solid var(--cinza-claro);position:relative}
.cal-dia:hover{border-color:var(--azul-claro)}
.cal-vazio{background:transparent;border:none;cursor:default}
.cal-hoje{border:2px solid var(--dourado);background:var(--dourado-claro)}
.cal-dia-num{font-size:12px;font-weight:700}
.cal-com-conta{border-right:4px solid var(--vermelho)}
.cal-dia-conta{font-size:9px;font-weight:800;color:var(--txt-vermelho);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (max-width:780px){
  #sidebar{transform:translateX(-100%)}
  body:not(.sidebar-hidden) #sidebar{transform:translateX(0);box-shadow:0 0 40px rgba(0,0,0,.3)}
  #main{margin-left:0}
  .form-grid{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
<!-- Login com Google — o Client ID abaixo não é segredo (identifica o

<script src="https://accounts.google.com/gsi/client" async defer onload="inicializarLoginGoogle()"></script>
</head>

<div id="loading-bar"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// CONFIGURAÇÃO — troque isso quando implantar o Apps Script (ver o
// arquivo apps-script-backend.gs que acompanha esse sistema)
// ═══════════════════════════════════════════════════════════════
const SHEETS_API_URL = 'https://script.google.com/macros/s/AKfycbyxy0Tem0j2CQAH69iD1IX_h3TedNixQbx3Vh_NwUGWYTkxP2HdA4DX-_niBp_oQxzY/exec';
const GOOGLE_CLIENT_ID = '866951819808-tqeoto2rqnr34p7250mmq6l7mn93afs2.apps.googleusercontent.com';
let _googleIdToken = null; // preenchido só depois de um login com Google bem-sucedido
let _googleBotaoRenderizado = false;
let _sessaoExpirada = false; // true quando a sincronização falhou por token vencido e a renovação silenciosa também não deu certo

let DB = {
  config:{pessoa1_nome:'Pessoa 1', pessoa2_nome:'Pessoa 2', renda_base_p1:0, renda_base_p2:0, modo_divisao:'proporcional', meta_economia_pct:20,
    origem_renda_p1:'', origem_renda_p2:'', dia_recebimento_p1:0, dia_recebimento_p2:0, frequencia_renda_p1:'mensal', frequencia_renda_p2:'mensal'},
  entradas:[], despesas_fixas:[], despesas:[], potes:[], aportes:[]
};
const TABELAS = ['config','entradas','despesas_fixas','despesas','potes','aportes'];

// ═══════════════════════════════════════════════════════════════
// AUTENTICAÇÃO / LOGIN
// ═══════════════════════════════════════════════════════════════
function credenciaisAuth(){ return { token: _googleIdToken }; }

// Chamado pelo Google depois que a pessoa escolhe a conta e confirma —
// "response.credential" é o token assinado pelo Google (ID token), que o
// Apps Script confere de verdade do lado do servidor (contra AUTHORIZED_EMAILS
// nas Script Properties) antes de liberar qualquer dado.
function entrarComGoogle(response){
  _googleIdToken=response.credential;
  document.getElementById('login-error').textContent='';
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  carregarLocal();
  finalizarLogin();
}
function inicializarLoginGoogle(tentativa){
  tentativa=tentativa||0;
  if(_googleBotaoRenderizado) return;
  const area=document.getElementById('login-google-area');
  const errEl=document.getElementById('login-error');
  if(typeof google==='undefined' || !google.accounts || !area){
    if(tentativa<20){ setTimeout(()=>inicializarLoginGoogle(tentativa+1),250); return; }
    if(errEl) errEl.textContent='⚠️ Não deu pra carregar o login do Google — verifique sua internet e recarregue a página.';
    return;
  }
  try{
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: entrarComGoogle });
    google.accounts.id.renderButton(area, { theme:'outline', size:'large', width:280, text:'signin_with' });
    _googleBotaoRenderizado=true;
  }catch(e){
    if(errEl) errEl.textContent='⚠️ Erro ao iniciar login do Google: '+e.message;
  }
}
// Renova o token do Google silenciosamente (dura só ~1h) sem precisar
// recarregar a página nem pedir pra ninguém clicar em nada de novo.
function renovarSessaoGoogle(){
  return new Promise((resolve)=>{
    if(typeof google==='undefined' || !google.accounts){ resolve(false); return; }
    let resolvido=false;
    const restaurarCallbackPadrao=()=>{ try{ google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: entrarComGoogle }); }catch(e){} };
    const finalizar=(ok)=>{ if(resolvido) return; resolvido=true; restaurarCallbackPadrao(); resolve(ok); };
    try{
      google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, auto_select:true, callback:(response)=>{ _googleIdToken=response.credential; finalizar(true); } });
      google.accounts.id.prompt((notification)=>{
        if((notification.isNotDisplayed&&notification.isNotDisplayed()) || (notification.isSkippedMoment&&notification.isSkippedMoment())) finalizar(false);
      });
      setTimeout(()=>finalizar(false), 8000);
    }catch(e){ finalizar(false); }
  });
}
function sair(){
  _googleIdToken=null;
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
}
function finalizarLogin(){
  inicializarSidebar();
  inicializarTema();
  goTo('dashboard');
  setTimeout(()=>sincronizarSheets(),500);
}

// ═══════════════════════════════════════════════════════════════
// PERSISTÊNCIA LOCAL
// ═══════════════════════════════════════════════════════════════
function salvarLocal(){ try{ localStorage.setItem('nd_db', JSON.stringify(DB)); }catch(e){} }
function carregarLocal(){
  try{
    const raw=localStorage.getItem('nd_db');
    if(raw){ const parsed=JSON.parse(raw); TABELAS.forEach(t=>{ if(parsed[t]!==undefined) DB[t]=parsed[t]; }); }
  }catch(e){}
}

// ═══════════════════════════════════════════════════════════════
// SINCRONIZAÇÃO — mesmo motor testado no ERP, com as mesmas proteções
// (edição recente não é revertida por leitura desatualizada; exclusão
// recente não "ressuscita"; tabela vazia não sobrescreve dado local)
// ═══════════════════════════════════════════════════════════════
let _tabelasComSyncPendente = new Set();
let _tabelasBloqueadasPorSeguranca = [];
let _ultimaEdicaoLocal = {};
let _ultimaExclusaoLocal = {};
let _pendingQueue = [];
let _contadorPendentePorTabela = {};
let _syncChainPorTabela = {};
let _logSincronizacao = [];

function registrarLogSync(tipo, detalhe){
  _logSincronizacao.unshift({tipo, detalhe, quando:new Date().toISOString()});
  if(_logSincronizacao.length>100) _logSincronizacao.pop();
}
function setSyncStatus(status, msg){
  const el=document.getElementById('sync-badge');
  if(!el) return;
  el.className=status;
  el.textContent=msg;
}
function normalizarData(str){
  if(!str) return '';
  const m=String(str).match(/^(\d{4}-\d{2}-\d{2})/);
  return m?m[1]:String(str);
}
function nextId(arr, prefixo){
  let max=0;
  (arr||[]).forEach(x=>{ const m=String(x.id||'').match(/(\d+)$/); if(m) max=Math.max(max,+m[1]); });
  return prefixo+'-'+String(max+1).padStart(3,'0');
}
function getItem(arr, id){ return (arr||[]).find(x=>x.id===id); }

async function enviarParaSheets(acao, tabela, dados, id){
  if(!SHEETS_API_URL || SHEETS_API_URL==='COLE_URL_DO_APPS_SCRIPT_AQUI') return true;
  if(acao==='upsert' && dados && dados.id!=null){
    _ultimaEdicaoLocal[`${tabela}:${dados.id}`]=Date.now();
  }
  const res=await fetch(SHEETS_API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({acao,tabela,dados,id,...credenciaisAuth()})});
  const data=await res.json();
  if(!data.ok) throw new Error(data.erro||'Servidor não confirmou o salvamento');
  return true;
}
function enviarParaSheetsBackground(acao, tabela, dados, id){
  _tabelasComSyncPendente.add(tabela);
  _contadorPendentePorTabela[tabela]=(_contadorPendentePorTabela[tabela]||0)+1;
  const anterior=_syncChainPorTabela[tabela]||Promise.resolve();
  const atual=anterior.catch(()=>{}).then(()=>enviarParaSheets(acao,tabela,dados,id));
  _syncChainPorTabela[tabela]=atual.catch(()=>{});
  atual.finally(()=>{
    _contadorPendentePorTabela[tabela]=Math.max(0,(_contadorPendentePorTabela[tabela]||1)-1);
    if(_contadorPendentePorTabela[tabela]===0) _tabelasComSyncPendente.delete(tabela);
  });
  return atual;
}
async function salvarItem(tabela, obj){
  const arr=DB[tabela];
  const idx=arr.findIndex(x=>x.id===obj.id);
  if(idx>=0) arr[idx]=obj; else arr.push(obj);
  salvarLocal();
  setSyncStatus('ok','✅ Salvo');
  _ultimaEdicaoLocal[`${tabela}:${obj.id}`]=Date.now();
  enviarParaSheetsBackground('upsert', tabela, obj).then(()=>{
    setSyncStatus('ok','✅ Sincronizado');
  }).catch(e=>{
    _pendingQueue.push({acao:'upsert', tabela, dados:obj, ultimoErro:e?.message||String(e), tentadoEm:new Date().toISOString()});
    salvarLocal();
    setSyncStatus('error','📴 Salvo local');
  });
  return true;
}
async function excluirItem_db(tabela, id){
  const arr=DB[tabela];
  const idx=arr.findIndex(x=>x.id===id);
  if(idx>=0) arr.splice(idx,1);
  salvarLocal();
  setSyncStatus('ok','✅ Excluído');
  _ultimaExclusaoLocal[`${tabela}:${id}`]=Date.now();
  enviarParaSheetsBackground('excluir', tabela, null, id).then(()=>{
    setSyncStatus('ok','✅ Sincronizado');
  }).catch(e=>{
    _pendingQueue.push({acao:'excluir', tabela, id, ultimoErro:e?.message||String(e), tentadoEm:new Date().toISOString()});
    salvarLocal();
    setSyncStatus('error','📴 Excluído local');
  });
  return true;
}
async function excluirItem(tabela, id){
  if(!confirm('Confirma excluir?')) return;
  await excluirItem_db(tabela, id);
  render(currentSection);
}
async function sincronizarSheets(){
  if(!SHEETS_API_URL || SHEETS_API_URL==='COLE_URL_DO_APPS_SCRIPT_AQUI'){
    setSyncStatus('error','📴 Sem URL configurada');
    return;
  }
  setSyncStatus('loading','🔄 Sincronizando...');
  try{
    await processarFila();
    const tabelasComPendenciaNaFila=new Set(_pendingQueue.map(op=>op.tabela));
    const CAMPOS_DATA=['data','venc','dia_vencimento_data'];
    const _authParam=credenciaisAuth().token?'token='+encodeURIComponent(credenciaisAuth().token):'';
    const url=SHEETS_API_URL+'?acao=ler_tudo&'+_authParam;
    const res=await fetch(url);
    const data=await res.json();
    if(!data.ok){
      const erro=data.erro||'Falha ao ler dados';
      // Distingue "token do Google vencido" de erro de rede/servidor de
      // verdade — sem isso, os dois caíam no mesmo catch e mostravam
      // "📴 Offline" pra sempre, mesmo com internet normal, até recarregar
      // a página (que sem querer pedia um token novo por trás).
      if(/token|autenticad|autorizad/i.test(erro)){
        registrarLogSync('erro_auth', erro);
        const renovou=await renovarSessaoGoogle();
        if(renovou){
          registrarLogSync('info','Sessão do Google renovada — tentando sincronizar de novo');
          setTimeout(()=>sincronizarSheets(),300);
          return;
        }
        _sessaoExpirada=true;
        setSyncStatus('error','🔒 Sessão expirada — toque aqui');
        return;
      }
      throw new Error(erro);
    }
    const tabelasBloqueadasPorSeguranca=[];
    Object.keys(data.dados).forEach(tabela=>{
      if(_tabelasComSyncPendente.has(tabela)) return;
      if(tabelasComPendenciaNaFila.has(tabela)) return;
      if(DB[tabela]===undefined) return;
      let registros=data.dados[tabela]||[];
      if(Array.isArray(registros) && registros.length===0 && Array.isArray(DB[tabela]) && DB[tabela].length>0){
        tabelasBloqueadasPorSeguranca.push(tabela);
        registrarLogSync('protecao_tabela_vazia', `"${tabela}" veio vazia do Google, dados locais preservados.`);
        return;
      }
      const JANELA_PROTECAO_EDICAO_MS=3*60*1000;
      const localPorId={};
      if(tabela==='config'){
        if(DB.config && typeof DB.config==='object') localPorId[1]=DB.config;
      } else {
        (Array.isArray(DB[tabela])?DB[tabela]:[]).forEach(r=>{ if(r && r.id!=null) localPorId[r.id]=r; });
      }
      if(Array.isArray(registros)){
        registros=registros.map(reg=>{
          if(reg && typeof reg==='object'){
            CAMPOS_DATA.forEach(campo=>{ if(reg[campo]) reg[campo]=normalizarData(reg[campo]); });
            if(reg.id!=null){
              const editadoEm=_ultimaEdicaoLocal[`${tabela}:${reg.id}`];
              const versaoLocal=localPorId[reg.id];
              if(editadoEm && versaoLocal && (Date.now()-editadoEm)<JANELA_PROTECAO_EDICAO_MS){
                const diferente=JSON.stringify(versaoLocal)!==JSON.stringify(reg);
                if(diferente){
                  registrarLogSync('protecao_edicao_recente', `"${tabela}" id ${reg.id} veio desatualizado do Google logo após uma edição local — mantida a versão local.`);
                  enviarParaSheetsBackground('upsert', tabela, versaoLocal);
                  return versaoLocal;
                }
              }
            }
          }
          return reg;
        });
        registros=registros.filter(reg=>{
          if(reg && typeof reg==='object' && reg.id!=null){
            const excluidoEm=_ultimaExclusaoLocal[`${tabela}:${reg.id}`];
            if(excluidoEm && (Date.now()-excluidoEm)<JANELA_PROTECAO_EDICAO_MS){
              registrarLogSync('protecao_exclusao_recente', `"${tabela}" id ${reg.id} voltou do Google logo após ser excluído localmente.`);
              enviarParaSheetsBackground('excluir', tabela, null, reg.id);
              return false;
            }
          }
          return true;
        });
      }
      DB[tabela]=registros;
    });
    if(Array.isArray(DB.config) && DB.config.length>0) DB.config=DB.config[0];
    salvarLocal();
    _tabelasBloqueadasPorSeguranca=tabelasBloqueadasPorSeguranca;
    _sessaoExpirada=false;
    if(tabelasBloqueadasPorSeguranca.length>0){
      setSyncStatus('error','⚠️ Verifique: '+tabelasBloqueadasPorSeguranca.join(', '));
    } else {
      setSyncStatus('ok','✅ Sincronizado');
    }
    if(document.getElementById('content')) render(currentSection);
  }catch(e){
    console.warn('Sync offline:', e.message);
    setSyncStatus('error','📴 Offline');
  }
}
async function processarFila(){
  if(_pendingQueue.length===0) return;
  const fila=[..._pendingQueue];
  _pendingQueue=[];
  for(const op of fila){
    try{
      if(op.acao==='upsert') await enviarParaSheets('upsert', op.tabela, op.dados);
      else if(op.acao==='excluir') await enviarParaSheets('excluir', op.tabela, null, op.id);
    }catch(e){
      _pendingQueue.push({...op, ultimoErro:e?.message||String(e), tentadoEm:new Date().toISOString()});
    }
  }
  salvarLocal();
}
function sincronizarAgora(){ sincronizarSheets(); }
function verPendencias(){
  if(_sessaoExpirada){
    openModal('🔒 Sessão expirada',
      `<p style="font-size:12.5px;color:var(--cinza-med)">Sua sessão do Google expirou — isso é normal depois de um tempo com a aba aberta sem uso. Toque no botão abaixo pra renovar: não precisa recarregar a página, e nada do que você preencheu se perde.</p>`,
      async()=>{
        closeModal();
        const ok=await renovarSessaoGoogle();
        if(ok){ _sessaoExpirada=false; toast('Sessão renovada! Sincronizando...'); sincronizarSheets(); }
        else toast('Não deu pra renovar automaticamente — tenta recarregar a página','error');
      }, '🔓 Renovar Sessão');
    return;
  }
  if(_tabelasBloqueadasPorSeguranca.length>0){
    const tabelas=_tabelasBloqueadasPorSeguranca;
    openModal('🛡️ Proteção Ativada',
      `<p style="font-size:12.5px;color:var(--cinza-med);margin-bottom:12px">O Google devolveu ${tabelas.length===1?'a tabela':'as tabelas'} <b>${tabelas.join(', ')}</b> vazia${tabelas.length===1?'':'s'}, mas seu navegador tem dados aí — nada foi apagado, só travou a atualização por segurança.</p>`,
      async()=>{ closeModal(); for(const tabela of tabelas){ for(const obj of DB[tabela]){ await enviarParaSheets('upsert',tabela,obj); } } _tabelasBloqueadasPorSeguranca=[]; setSyncStatus('ok','✅ Sincronizado'); toast('Reenviado!'); }, '☁️ Reenviar pro Google Agora');
    return;
  }
  if(_pendingQueue.length===0){ toast('Tudo sincronizado, sem pendências! ✅'); return; }
  openModal(`⚠️ ${_pendingQueue.length} Pendência(s)`,
    `<div class="tbl-wrap"><table><thead><tr><th>Ação</th><th>Tabela</th><th>Erro</th></tr></thead>
    <tbody>${_pendingQueue.map(op=>`<tr><td>${op.acao}</td><td>${op.tabela}</td><td style="font-size:11px;color:var(--txt-vermelho)">${op.ultimoErro||'—'}</td></tr>`).join('')}</tbody></table></div>`,
    async()=>{ closeModal(); await sincronizarAgora(); }, '🔄 Tentar Sincronizar Agora');
}

  if(!drop) return;

function sselPick(id, value){
  const opts=_sselData[id]||[];
  const o=opts.find(x=>String(x.value)===String(value));
  document.getElementById(id+'_txt').value=o?o.label:'';
  document.getElementById(id+'_val').value=value;
  document.getElementById(id+'_drop').classList.remove('show');
  const fn=window[id+'_onchange'];
  if(fn) fn(value);
}

// ═══════════════════════════════════════════════════════════════
// UTILITÁRIOS FINANCEIROS (metas com prazo flexível, divisão de
// valores sem erro de arredondamento, saldo líquido entre os dois)
// ═══════════════════════════════════════════════════════════════

// Divide um valor total entre pesos (ex: rendas) garantindo que a soma das
// partes bate EXATAMENTE com o total (método dos maiores restos, em
// centavos) — evita que 0,01 "suma" ou "sobre" por causa de arredondamento.
function dividirValorExato(total, pesos){
  const totalCent = Math.round((+total||0)*100);
  const somaPesos = pesos.reduce((s,p)=>s+(+p||0),0);
  if(somaPesos<=0){
    const n=pesos.length;
    const base=Math.floor(totalCent/n);
    const partes=new Array(n).fill(base);
    let resto=totalCent-base*n;
    for(let i=0;i<resto;i++) partes[i]++;
    return partes.map(c=>c/100);
  }
  const brutos=pesos.map(p=>totalCent*((+p||0)/somaPesos));
  const partesCent=brutos.map(Math.floor);
  const alocado=partesCent.reduce((s,v)=>s+v,0);
  const resto=totalCent-alocado;
  const restos=brutos.map((v,i)=>({i, frac:v-Math.floor(v)}));
  restos.sort((a,b)=>b.frac-a.frac);
  for(let k=0;k<resto;k++){ partesCent[restos[k%restos.length].i]++; }
  return partesCent.map(c=>c/100);
}
function diasEntre(dataA, dataB){
  const a=new Date(dataA+'T00:00:00'), b=new Date(dataB+'T00:00:00');
  return Math.round((b-a)/86400000);
}
// Converte uma duração (anos/meses/semanas/dias, combináveis) numa data
// final real, a partir da data de início da meta.
function calcularPrazoData(dataInicio, duracao){
  const d = new Date((dataInicio||new Date().toISOString().slice(0,10))+'T00:00:00');
  d.setFullYear(d.getFullYear() + (+duracao.anos||0));
  d.setMonth(d.getMonth() + (+duracao.meses||0));
  d.setDate(d.getDate() + (+duracao.semanas||0)*7 + (+duracao.dias||0));
  return d.toISOString().slice(0,10);
}
// Quanto falta guardar por dia/semana/mês pra bater a meta no prazo.
// "por_mes" usa média de dias por mês (365,25/12) — é uma estimativa,
// não conta mês-calendário exato, mas é o suficiente pra planejamento.
function calcularNecessidadesMeta(valorRestante, hoje, prazoData){
  if(!prazoData) return { dias_restantes:null, semanas_restantes:null, meses_restantes:null, por_dia:null, por_semana:null, por_mes:null };
  const diasRestantes=Math.max(0, diasEntre(hoje, prazoData));
  const semanasRestantes=diasRestantes/7;
  const mesesRestantes=diasRestantes/30.4368;
  return {
    dias_restantes: diasRestantes,
    semanas_restantes: semanasRestantes,
    meses_restantes: mesesRestantes,
    por_dia: diasRestantes>0? valorRestante/diasRestantes : valorRestante,
    por_semana: semanasRestantes>0? valorRestante/semanasRestantes : valorRestante,
    por_mes: mesesRestantes>0? valorRestante/mesesRestantes : valorRestante,
  };
}
// Datas de vencimento de cada parcela de um parcelamento, a partir da
// primeira parcela — mensal respeita o dia certinho, com o mesmo cuidado
// de "cair no último dia do mês" já usado em despesas fixas (ex: parcela
// no dia 31 de um mês que só tem 28/30 dias).
function gerarDatasParcelas(dataPrimeira, qtd, frequencia){
  const passoDias = frequencia==='semanal'?7 : frequencia==='quinzenal'?15 : 30;
  const base = new Date(dataPrimeira+'T00:00:00');
  const datas=[];
  for(let n=1;n<=qtd;n++){
    let venc;
    if(frequencia==='mensal'){
      const anoBase=base.getFullYear(), mesBase=base.getMonth(), diaBase=base.getDate();
      const mesAlvo=mesBase+(n-1);
      const ultimoDia=new Date(anoBase, mesAlvo+1, 0).getDate();
      venc=new Date(anoBase, mesAlvo, Math.min(diaBase, ultimoDia));
    } else {
      venc=new Date(base); venc.setDate(base.getDate()+passoDias*(n-1));
    }
    datas.push(venc.toISOString().slice(0,10));
  }
  return datas;
}
// Saldo líquido entre as duas pessoas: soma as partes não pagas de cada
// "divisão" avulsa (quem não pagou deve a parte dele pra quem pagou) e as
// parcelas pendentes/atrasadas de cada parcelamento, nas duas direções, e
// devolve só o saldo final com direção — sem juntar as duas dívidas como
// se fossem independentes (o histórico original continua intacto).
function calcularSaldoLiquido(divisoes, parcelas, parcelamentos){
  let p1DeveP2=0, p2DeveP1=0;
  (divisoes||[]).forEach(d=>{
    if(d.pago_por==='p1') p2DeveP1+=(+d.parte_p2||0);
    else if(d.pago_por==='p2') p1DeveP2+=(+d.parte_p1||0);
  });
  const parcelamentosById={}; (parcelamentos||[]).forEach(p=>parcelamentosById[p.id]=p);
  (parcelas||[]).forEach(pc=>{
    if(pc.status!=='Pendente' && pc.status!=='Atrasado') return;
    const pl=parcelamentosById[pc.parcelamento_id]; if(!pl) return;
    if(pl.pessoa_deve==='p1') p1DeveP2+=(+pc.valor||0);
    else if(pl.pessoa_deve==='p2') p2DeveP1+=(+pc.valor||0);
  });
  const liquido=p1DeveP2-p2DeveP1;
  return {
    p1_deve_p2: Math.round(p1DeveP2*100)/100,
    p2_deve_p1: Math.round(p2DeveP1*100)/100,
    liquido_valor: Math.round(Math.abs(liquido)*100)/100,
    liquido_direcao: liquido>0.004?'p1_para_p2': liquido<-0.004?'p2_para_p1':'quites'
  };
}

  const alvo=[...document.querySelectorAll('.nav-item')].find(el=>el.getAttribute('onclick')===`goTo('${sec}')`);

  document.getElementById('page-title').textContent=TITULOS[sec]||sec;
  render(sec);
  if(window.innerWidth<780) closeSidebar();
}
function render(sec){
  currentSection=sec;
  const fn=SECTIONS[sec];
  document.getElementById('content').innerHTML=fn?fn():'<p>Em construção</p>';
}

// ═══════════════════════════════════════════════════════════════
// CÁLCULOS CENTRAIS
// ═══════════════════════════════════════════════════════════════
function mesAtualStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function nomePessoa(p){ return p==='p1'?(DB.config.pessoa1_nome||'Pessoa 1'):p==='p2'?(DB.config.pessoa2_nome||'Pessoa 2'):'Casal'; }
function entradasDoMes(mesRef){ return DB.entradas.filter(e=>(e.data||'').slice(0,7)===mesRef); }
function rendaPessoaMes(pessoa, mesRef){ return entradasDoMes(mesRef).filter(e=>e.pessoa===pessoa).reduce((s,e)=>s+(+e.valor||0),0); }
function rendaBasePessoa(pessoa){ return pessoa==='p1'?+(DB.config.renda_base_p1||0):+(DB.config.renda_base_p2||0); }
// Percentual de divisão dos gastos do casal — proporcional à renda (o
// modelo mais indicado por planejadores financeiros quando a renda é
// diferente) ou igual (50/50), conforme escolhido em Configurações.
// Usa a renda BASE configurada (estável), não a soma das entradas
// lançadas no mês — assim a divisão não fica indefinida antes de alguém
// lançar a entrada do mês.
function percentuaisDivisao(){
  const r1=rendaBasePessoa('p1'), r2=rendaBasePessoa('p2');
  const total=r1+r2;
  if(DB.config.modo_divisao==='igual' || total<=0) return {p1:0.5, p2:0.5};
  return {p1:r1/total, p2:r2/total};
}
function despesasDoMes(mesRef){ return DB.despesas.filter(d=>(d.venc||d.data||'').slice(0,7)===mesRef); }
function despesasPorTipo(mesRef, tipo){ return despesasDoMes(mesRef).filter(d=>d.tipo===tipo); }
function totalPorTipo(mesRef, tipo){ return despesasPorTipo(mesRef,tipo).reduce((s,d)=>s+(+d.valor||0),0); }

// ═══════════════════════════════════════════════════════════════
// DESPESAS FIXAS — geração automática mensal + deduplicação (mesma
// lógica já testada e corrigida no ERP: agrupa por nome+mês, prioriza
// a que já está paga, protege contra corrida de sincronização)
// ═══════════════════════════════════════════════════════════════
function desduplicarDespesasFixas(){
  const grupos={};
  DB.despesas_fixas.forEach(df=>{
    const chave=`${(df.descricao||'').trim().toLowerCase()}:${df.tipo||''}`;
    if(!grupos[chave]) grupos[chave]=[];
    grupos[chave].push(df);
  });
  const remover=[];
  Object.values(grupos).forEach(grupo=>{
    if(grupo.length<=1) return;
    grupo.sort((a,b)=>{
      const diaA=+a.dia_vencimento>0?1:0, diaB=+b.dia_vencimento>0?1:0;
      if(diaA!==diaB) return diaB-diaA;
      return (a.criado_em||'').localeCompare(b.criado_em||'');
    });
    const vencedor=grupo[0];
    grupo.slice(1).forEach(df=>{
      remover.push(df.id);
      DB.despesas.forEach(x=>{ if(x.despesa_fixa_id===df.id) x.despesa_fixa_id=vencedor.id; });
    });
  });
  if(remover.length===0) return;
  DB.despesas_fixas=DB.despesas_fixas.filter(df=>!remover.includes(df.id));
  salvarLocal();
  remover.forEach(id=>enviarParaSheetsBackground('excluir','despesas_fixas',null,id));
}
function desduplicarDespesasGeradas(){
  const grupos={};
  DB.despesas.forEach(x=>{
    if(!x.mes_ref) return;
    const chave=`${(x.descricao||'').trim().toLowerCase()}:${x.tipo||''}:${x.mes_ref}`;
    if(!grupos[chave]) grupos[chave]=[];
    grupos[chave].push(x);
  });
  const remover=[];
  Object.values(grupos).forEach(grupo=>{
    if(grupo.length<=1) return;
    grupo.sort((a,b)=>{
      const pagoA=a.status==='Pago'?1:0, pagoB=b.status==='Pago'?1:0;
      if(pagoA!==pagoB) return pagoB-pagoA;
      return (a.criado_em||'').localeCompare(b.criado_em||'');
    });
    grupo.slice(1).forEach(x=>remover.push(x.id));
  });
  if(remover.length===0) return;
  DB.despesas=DB.despesas.filter(x=>!remover.includes(x.id));
  salvarLocal();
  remover.forEach(id=>enviarParaSheetsBackground('excluir','despesas',null,id));
}
function gerarDespesasFixasDoMes(){
  desduplicarDespesasFixas();
  desduplicarDespesasGeradas();
  const hoje=new Date();
  const mesRef=`${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}`;
  const nomesJaGerados=new Set();
  DB.despesas_fixas.forEach(df=>{
    const chaveNome=`${(df.descricao||'').trim().toLowerCase()}:${df.tipo||''}`;
    if(nomesJaGerados.has(chaveNome)) return;
    nomesJaGerados.add(chaveNome);
    const jaExiste=DB.despesas.some(x=>(x.despesa_fixa_id===df.id && x.mes_ref===mesRef) || (x.mes_ref===mesRef && `${(x.descricao||'').trim().toLowerCase()}:${x.tipo||''}`===chaveNome));
    if(jaExiste) return;
    const ultimoDiaMes=new Date(hoje.getFullYear(), hoje.getMonth()+1, 0).getDate();
    const dia=Math.min(+df.dia_vencimento||1, ultimoDiaMes);
    const venc=`${mesRef}-${String(dia).padStart(2,'0')}`;
    const obj={
      id:nextId(DB.despesas,'DESP'), data:new Date().toISOString().slice(0,10),
      descricao:df.descricao, categoria:df.categoria||'Fixa', tipo:df.tipo,
      valor:+df.valor||0, pago:0, venc, status:'Em aberto',
      despesa_fixa_id:df.id, mes_ref:mesRef, criado_em:new Date().toISOString()
    };
    DB.despesas.push(obj);
    salvarLocal();
    _ultimaEdicaoLocal[`despesas:${obj.id}`]=Date.now();
    enviarParaSheetsBackground('upsert','despesas',obj);
  });
}

// ═══════════════════════════════════════════════════════════════
// POTES / METAS — valor_atual sempre calculado a partir do histórico de
// aportes (nunca guardado direto), pra manter um extrato auditável de
// quem colocou quanto e quando
// ═══════════════════════════════════════════════════════════════
// Divide a contribuição mensal de uma meta "casal" entre as duas pessoas,
// conforme a forma escolhida — reaproveita dividirValorExato pra nunca
// deixar sobrar/faltar centavo entre as duas partes.
function contribuicaoPorPessoaMeta(p, contribMensal){
  if(p.forma_contribuicao==='personalizado'){
    return { p1:+p.contrib_personalizada_p1||0, p2:+p.contrib_personalizada_p2||0 };
  }
  if(p.quem==='p1') return { p1:contribMensal, p2:0 };
  if(p.quem==='p2') return { p1:0, p2:contribMensal };
  if(p.forma_contribuicao==='proporcional'){
    const [p1,p2]=dividirValorExato(contribMensal, [rendaBasePessoa('p1'), rendaBasePessoa('p2')]);
    return { p1, p2 };
  }
  const [p1,p2]=dividirValorExato(contribMensal, [1,1]);
  return { p1, p2 };
}
// valor_atual só soma aportes CONFIRMADOS (aportes antigos sem "status"
// contam como confirmados — retrocompatível). Aportes com status
// "planejado" ficam à parte, pra aparecer no calendário como pendência.
function potesComProgresso(){
  const hoje=new Date().toISOString().slice(0,10);
  return ordNome(DB.potes).map(p=>{
    const aportesDaMeta=DB.aportes.filter(a=>a.pote_id===p.id);
    const aportesConfirmados=aportesDaMeta.filter(a=>a.status!=='planejado');
    const aportesPlanejados=aportesDaMeta.filter(a=>a.status==='planejado');
    const valorAtual=aportesConfirmados.reduce((s,a)=>s+(+a.valor||0),0);
    const metaValor=+p.meta_valor||0;
    const valorRestante=Math.max(0, metaValor-valorAtual);
    const pct=metaValor>0?Math.min(100, valorAtual/metaValor*100):0;
    const prazoData=(p.prazo_modo && p.prazo_modo!=='sem_prazo')?p.prazo_data:null;
    const necessidades=calcularNecessidadesMeta(valorRestante, hoje, prazoData);
    const contribMensal=(p.contribuicao_mensal_planejada!=null && p.contribuicao_mensal_planejada!=='')?(+p.contribuicao_mensal_planejada||0):(necessidades.por_mes||0);
    const contribPorPessoa=contribuicaoPorPessoaMeta(p, contribMensal);
    return {...p, valor_atual:valorAtual, valor_restante:valorRestante, pct,
      aportes:aportesConfirmados, aportes_planejados:aportesPlanejados,
      ...necessidades, contribuicao_mensal_efetiva:contribMensal,
      contrib_calc_p1:contribPorPessoa.p1, contrib_calc_p2:contribPorPessoa.p2};
  });
}

  return `
  <div class="kpi-grid">

      `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px">
        ${potesOrdenados.map(p=>{
          const corPrioridade=p.prioridade==='alta'?'vermelho':p.prioridade==='baixa'?'verde':'amarelo';

            </div>
            <div style="font-size:11px;color:var(--cinza-med);margin-top:6px">${p.prazo_data?`⏳ ${p.dias_restantes}d restantes · ${R$(p.por_mes)}/mês`:'Sem prazo definido'}</div>

function atualizarCamposPrazoMeta(){

  document.getElementById('f-potecampo-duracao').style.display=modo==='duracao'?'':'none';
}
function atualizarCamposFormaMeta(){
  const quem=document.getElementById('f-potequem').value;
  const campoForma=document.getElementById('f-potecampo-forma');
  campoForma.style.display=quem==='casal'?'':'none';
  const forma=document.getElementById('f-poteforma').value;
  const showPers=quem==='casal' && forma==='personalizado';
  document.getElementById('f-potecampo-pers-p1').style.display=showPers?'':'none';
  document.getElementById('f-potecampo-pers-p2').style.display=showPers?'':'none';

function novoPote(){ openModal('➕ Nova Meta', formPote(), ()=>salvarPote()); }
function editarPote(id){ openModal('✏️ Editar Meta', formPote(getItem(DB.potes,id)), ()=>salvarPote(id)); }
async function salvarPote(id=null){
  const existente=id?getItem(DB.potes,id):null;
  const prazoModo=document.getElementById('f-poteprazomodo').value;
  const dataInicio=document.getElementById('f-potedatainicio').value || new Date().toISOString().slice(0,10);
  let prazoData=null, prazoDuracao=null;
  if(prazoModo==='data'){
    prazoData=document.getElementById('f-poteprazodata').value||null;
  } else if(prazoModo==='duracao'){
    prazoDuracao={
      anos:parseInt(document.getElementById('f-poteduranos').value)||0,
      meses:parseInt(document.getElementById('f-potedurmeses').value)||0,
      semanas:parseInt(document.getElementById('f-potedursemanas').value)||0,
      dias:parseInt(document.getElementById('f-potedurdias').value)||0,
    };
    prazoData=calcularPrazoData(dataInicio, prazoDuracao);
  }
  const quem=document.getElementById('f-potequem').value;
  const forma=document.getElementById('f-poteforma').value;
  const contribManualStr=document.getElementById('f-potecontribmensal').value;
  const obj={
    id:id||nextId(DB.potes,'POTE'),
    nome:document.getElementById('f-potenome').value.trim(),
    descricao:document.getElementById('f-potedesc').value.trim(),
    icone:document.getElementById('f-poteicone').value.trim()||'🎯',
    tipo_meta:document.getElementById('f-potetipo').value,
    meta_valor:parseFloat(document.getElementById('f-potemeta').value)||0,
    data_inicio:dataInicio,
    prazo_modo:prazoModo,
    prazo_data:prazoData,
    prazo_duracao:prazoDuracao,
    prioridade:document.getElementById('f-poteprioridade').value,
    quem,
    forma_contribuicao:quem==='casal'?forma:'5050',
    contrib_personalizada_p1:forma==='personalizado'?(parseFloat(document.getElementById('f-potepersp1').value)||0):0,
    contrib_personalizada_p2:forma==='personalizado'?(parseFloat(document.getElementById('f-potepersp2').value)||0):0,
    contribuicao_mensal_planejada:contribManualStr!==''?(parseFloat(contribManualStr)||0):null,
    criado_em:existente?existente.criado_em:new Date().toISOString()
  };
  if(!obj.nome){toast('Informe o nome da meta','error');return;}
  if(!obj.meta_valor||obj.meta_valor<=0){toast('Informe um valor de meta válido','error');return;}
  if(prazoModo==='data' && !prazoData){toast('Informe a data do prazo','error');return;}
  await salvarItem('potes',obj);
  if(!existente){
    const elValorInicial=document.getElementById('f-potevalorinicial');
    const valorInicial=elValorInicial?(parseFloat(elValorInicial.value)||0):0;
    if(valorInicial>0){
      const aporte={id:nextId(DB.aportes,'APT'), pote_id:obj.id, pessoa:'casal', valor:valorInicial, data:dataInicio, status:'confirmado', observacao:'Valor inicial', criado_em:new Date().toISOString()};
      await salvarItem('aportes',aporte);
    }
  }
  toast(id?'Atualizado!':'Meta criada!'); closeModal(); render('metas');
}

    `<div class="form-grid cols-1">
      <div class="form-group"><label class="form-label">Quem está guardando</label><select class="form-select" id="f-aportepessoa">

      closeModal(); render('metas');
    }, '💰 Confirmar Aporte');
}
function confirmarAporte(aporteId){
  const a=getItem(DB.aportes,aporteId); if(!a) return;
  a.status='confirmado';
  salvarItem('aportes',a).then(()=>{ toast('Aporte confirmado! 🎉'); render(currentSection); });
}

      <div class="kpi-card"><div class="kpi-label">Falta</div><div class="kpi-value" style="font-size:15px">${R$(p.valor_restante)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Prazo</div><div class="kpi-value" style="font-size:12.5px">${prazoTxt}</div></div>
      ${p.por_dia!=null?`<div class="kpi-card"><div class="kpi-label">Por dia</div><div class="kpi-value" style="font-size:14px">${R$(p.por_dia)}</div></div>`:''}
      ${p.por_semana!=null?`<div class="kpi-card"><div class="kpi-label">Por semana</div><div class="kpi-value" style="font-size:14px">${R$(p.por_semana)}</div></div>`:''}
      ${p.por_mes!=null?`<div class="kpi-card"><div class="kpi-label">Por mês</div><div class="kpi-value" style="font-size:14px">${R$(p.por_mes)}</div></div>`:''}
    </div>
    ${p.quem==='casal'?`<div class="panel" style="margin:0 0 14px"><div style="padding:12px;font-size:12.5px">
      <b>Contribuição mensal (${formaLabel})</b>
      <div style="display:flex;justify-content:space-between;margin-top:6px"><span>${nomePessoa('p1')}</span><b>${R$(p.contrib_calc_p1)}</b></div>
      <div style="display:flex;justify-content:space-between"><span>${nomePessoa('p2')}</span><b>${R$(p.contrib_calc_p2)}</b></div>
    </div></div>`:''}
    ${planejados.length>0?`<div style="margin-bottom:14px"><b style="font-size:12.5px">🗓️ Aportes planejados</b>
      <div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Quem</th><th>Valor</th><th></th></tr></thead>
      <tbody>${planejados.map(a=>`<tr><td>${a.data}</td><td>${nomePessoa(a.pessoa)}</td><td>${R$(a.valor)}</td><td><button class="btn btn-success btn-xs" onclick="confirmarAporte('${a.id}')">✅ Confirmar</button></td></tr>`).join('')}</tbody></table></div>
    </div>`:''}
    <div><b style="font-size:12.5px">Histórico de aportes</b>
      <div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Quem</th><th>Valor</th><th>Obs.</th></tr></thead>

    </div>`,

}

// CALENDÁRIO
// ═══════════════════════════════════════════════════════════════
let _calMesAtual=new Date().getMonth(), _calAnoAtual=new Date().getFullYear();
function diasComContas(mes, ano){
  const porDia={};
  DB.despesas.forEach(x=>{
    if(!x.venc || x.status==='Pago') return;
    const d=new Date(normalizarData(x.venc)+'T00:00:00');
    if(isNaN(d)) return;
    if(d.getMonth()===mes && d.getFullYear()===ano){
      const dia=d.getDate();
      if(!porDia[dia]) porDia[dia]={qtd:0,valor:0};
      porDia[dia].qtd++; porDia[dia].valor+=(+x.valor||0);
    }
  });
  return porDia;
}
SECTIONS.calendario=()=>{
  gerarDespesasFixasDoMes();
  const hoje=new Date();
  const nomesMeses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const primeiroDia=new Date(_calAnoAtual,_calMesAtual,1);
  const diasNoMes=new Date(_calAnoAtual,_calMesAtual+1,0).getDate();
  const diaSemanaInicio=primeiroDia.getDay();
  const contas=diasComContas(_calMesAtual,_calAnoAtual);
  let celulas=[];
  for(let i=0;i<diaSemanaInicio;i++) celulas.push('<div class="cal-dia cal-vazio"></div>');
  for(let dia=1;dia<=diasNoMes;dia++){
    const ehHoje=dia===hoje.getDate() && _calMesAtual===hoje.getMonth() && _calAnoAtual===hoje.getFullYear();
    const infoConta=contas[dia];
    const dataStr=`${_calAnoAtual}-${String(_calMesAtual+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
    celulas.push(`<div class="cal-dia ${ehHoje?'cal-hoje':''} ${infoConta?'cal-com-conta':''}" onclick="abrirDetalheDiaCal('${dataStr}')">
      <div class="cal-dia-num">${dia}</div>
      ${infoConta?`<div class="cal-dia-conta">📤 ${R$(infoConta.valor)}</div>`:''}
    </div>`);
  }
  return `
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">📅 ${nomesMeses[_calMesAtual]} ${_calAnoAtual}</span>
      <div style="display:flex;gap:6px">
        <button class="btn btn-outline btn-sm" onclick="mudarMesCal(-1)">◀</button>
        <button class="btn btn-outline btn-sm" onclick="mudarMesCal(1)">▶</button>
      </div>
    </div>
    <div style="padding:12px">
      <div class="cal-grid" style="margin-bottom:6px">
        ${['DOM','SEG','TER','QUA','QUI','SEX','SÁB'].map(d=>`<div style="text-align:center;font-size:10.5px;font-weight:700;color:var(--cinza-med)">${d}</div>`).join('')}
      </div>
      <div class="cal-grid">${celulas.join('')}</div>
    </div>
    <div style="padding:10px 16px;font-size:11px;color:var(--cinza-med);border-top:1px solid var(--cinza-claro)">💡 Barra vermelha = tem despesa vencendo nesse dia. Clique num dia pra ver detalhes.</div>
  </div>`;
};
function mudarMesCal(delta){
  _calMesAtual+=delta;
  if(_calMesAtual>11){_calMesAtual=0;_calAnoAtual++;}
  if(_calMesAtual<0){_calMesAtual=11;_calAnoAtual--;}
  render('calendario');
}
function abrirDetalheDiaCal(dataStr){
  const doDia=DB.despesas.filter(x=>normalizarData(x.venc)===dataStr);
  openModal(`📅 ${dataStr.split('-').reverse().join('/')}`,
    doDia.length===0?`<p style="text-align:center;color:var(--cinza-med);padding:20px">Nada nesse dia.</p>`:
    `<div class="tbl-wrap"><table><thead><tr><th>Descrição</th><th>Quem</th><th>Valor</th><th>Status</th></tr></thead>
    <tbody>${doDia.map(x=>`<tr style="cursor:pointer" onclick="closeModal();editarDespesa('${x.id}')">
      <td class="fw-bold">${x.descricao}</td><td><span class="badge badge-${x.tipo}">${nomePessoa(x.tipo)}</span></td>
      <td class="fw-bold text-vermelho">${R$(x.valor)}</td><td>${x.status==='Pago'?'<span class="badge badge-ok">PAGO</span>':'<span class="badge badge-warn">EM ABERTO</span>'}</td>
    </tr>`).join('')}</tbody></table></div>`,
    ()=>closeModal(),'Fechar');
  document.getElementById('modal-save-btn').style.display='none';
}

async function salvarConfigPessoas(){
  DB.config.pessoa1_nome=document.getElementById('cfg-p1nome').value.trim()||'Pessoa 1';
  DB.config.pessoa2_nome=document.getElementById('cfg-p2nome').value.trim()||'Pessoa 2';
  DB.config.renda_base_p1=parseFloat(document.getElementById('cfg-p1renda').value)||0;
  DB.config.renda_base_p2=parseFloat(document.getElementById('cfg-p2renda').value)||0;
  DB.config.origem_renda_p1=document.getElementById('cfg-p1origem').value.trim();
  DB.config.origem_renda_p2=document.getElementById('cfg-p2origem').value.trim();
  DB.config.dia_recebimento_p1=parseInt(document.getElementById('cfg-p1dia').value)||0;
  DB.config.dia_recebimento_p2=parseInt(document.getElementById('cfg-p2dia').value)||0;
  DB.config.frequencia_renda_p1=document.getElementById('cfg-p1freq').value;
  DB.config.frequencia_renda_p2=document.getElementById('cfg-p2freq').value;
  DB.config.modo_divisao=document.getElementById('cfg-modo').value;
  const obj={...DB.config, id:1};
  DB.config=obj;
  salvarLocal();
  _ultimaEdicaoLocal['config:1']=Date.now();
  try{ await enviarParaSheets('upsert','config',obj); setSyncStatus('ok','✅ Sincronizado'); }
  catch(e){ _pendingQueue.push({acao:'upsert',tabela:'config',dados:obj,ultimoErro:e?.message||String(e),tentadoEm:new Date().toISOString()}); salvarLocal(); setSyncStatus('error','📴 Salvo local'); }
  toast('Configurações salvas!');
  render('config');
}
